# Peer discovery from a static list, so the three nodes form a cluster with no
# exec into any container. Nodes retry until all peers are up.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3
# nodes are stopped and started on purpose by the tests; do not let the
# survivors pause themselves over it
cluster_partition_handling = ignore
